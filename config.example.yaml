# Copy to config.yaml and chmod 600 config.yaml. Never commit the real cookie.
auth:
  cookie: "cf_clearance=...; csrftoken=..."
  user_agent: "Mozilla/5.0 (...) Firefox/..."

server:
  host: "0.0.0.0"
  port: 8765
  library_host: "0.0.0.0"
  library_port: 8766
  # Public URL prefix when served behind a path-based reverse proxy.
  base_path: "/nh"
  allowed_networks:
    - "127.0.0.1/32"
    - "192.168.50.0/24"
    - "100.64.0.0/10"
  # Only these socket peers may supply X-Forwarded-For. 172.16/12 covers
  # Docker's changing private bridge subnets; do not add public client ranges.
  trusted_proxies:
    - "127.0.0.1/32"
    - "172.16.0.0/12"

paths:
  storage: "~/nh"
  download_script: "./nh2_requireCfToken.sh"
  # Set only while migrating from the legacy shell configuration.
  # legacy_cookie_file: "./cookie.sh"

download:
  max_retry: 20
  media_servers: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  parallel: 100

cache:
  html_ttl_seconds: 900
  api_ttl_seconds: 60
  html_max_age_seconds: 604800
  html_max_bytes: 536870912
  extract_max_bytes: 5368709120
  preview_max_age_seconds: 86400
  preview_max_bytes: 2147483648
  sweep_interval_seconds: 3600

# V2 ordinary searches use only stored sampled evidence. Explicit visual indexing sends resized pages to NVIDIA.
# Export NVIDIA_API_KEY in the server/Compose environment. Never put the key here.
assistant:
  enabled: false
  provider: nvidia_nim
  api_base: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY
  parser_model: nvidia/nemotron-3.5-lightning-30b-a3b
  quality_model: nvidia/nemotron-3-super-120b-a12b
  embedding_model: nvidia/nemotron-3-embed-1b
  visual_model: z-ai/glm-5.3-flash
  result_limit: 5
  dense_candidate_count: 80
  rerank_candidate_count: 12
  # Default fast path: parser + query embedding, then local ranking.
  rerank_enabled: false
  interactive_timeout_seconds: 20
  interactive_budget_seconds: 40
  request_timeout_seconds: 75
  max_retries_interactive: 0
  max_retries_background: 6
  background_enabled: true
  max_remote_concurrency: 1
  min_request_interval_ms: 1600
  remote_image_analysis_enabled: false
  max_remote_image_edge: 896
  max_remote_image_bytes: 524288
  visual_index_on_new_gallery: false
  visual_lazy_index_enabled: false  # reserved; enabling is rejected to keep ordinary search upload-free
  visual_candidate_count: 80
  max_remote_images_per_request: 6
  max_remote_request_bytes: 5242880
  visual_request_timeout_seconds: 180

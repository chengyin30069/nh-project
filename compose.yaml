services:
  nh-server:
    build:
      context: .
      dockerfile: server.Dockerfile
    image: nh-project-server:local
    restart: unless-stopped
    user: "${NH_UID:-1000}:${NH_GID:-1000}"
    ports:
      - "8765:8765"
      - "8766:8766"
    environment:
      HOME: /home/nh
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /home/nh:/home/nh/nh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
